# Dual-EKF + NavSat setup for GPS-anchored multi-source fusion.
#
#   ekf_filter_node_odom  (local)  — fuses LIO + VIO,   publishes odom→base_link
#   ekf_filter_node_map   (global) — fuses LIO + GPS,   publishes map→odom
#   navsat_transform_node          — GPS/fix + local pose → /odometry/gps
#
# RViz fixed-frame: map  (or camera_init — connected via static odom↔camera_init)
# Drift behaviour: LIO drifts over long drives; the global EKF pulls the
# odom frame back toward the GPS datum through the map→odom correction.

ekf_filter_node_odom:
    ros__parameters:
        use_sim_time: true
        frequency: 50.0
        # Town10HD (and most urban CARLA maps) is effectively flat.  Locking
        # z / roll / pitch to zero prevents the global EKF from drifting
        # vertically once IMU / LIO noise accumulates — the car stays on
        # the ground plane instead of sliding 20+ m underground.
        two_d_mode: true
        publish_tf: true
        publish_acceleration: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom                 # local — publishes odom → base_link

        odom0: /Odometry                  # FAST-LIO2
        odom0_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_differential: false

        odom1: /vins_estimator/odometry   # VINS-Fusion (WIP, may be absent)
        odom1_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_differential: true

        # IMU — gravity-aligned orientation + angular dynamics.
        imu0: /imu/data
        imu0_config: [false, false, false,
                      true,  true,  false,
                      false, false, false,
                      true,  true,  true,
                      true,  true,  true]
        imu0_queue_size: 50
        imu0_nodelay: true
        imu0_differential: false
        imu0_relative: false
        imu0_remove_gravitational_acceleration: true

ekf_filter_node_map:
    ros__parameters:
        use_sim_time: true
        frequency: 50.0
        sensor_timeout: 0.1
        # Town10HD (and most urban CARLA maps) is effectively flat.  Locking
        # z / roll / pitch to zero prevents the global EKF from drifting
        # vertically once IMU / LIO noise accumulates — the car stays on
        # the ground plane instead of sliding 20+ m underground.
        two_d_mode: true
        transform_time_offset: 0.0
        transform_timeout: 0.0
        publish_tf: true
        publish_acceleration: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: map                  # global — publishes map → odom

        # FAST-LIO's /Odometry is differential here — position deltas only.
        # Orientation is owned by the IMU (imu0), not LIO, to keep roll/pitch
        # gravity-aligned and prevent the map from tilting.
        odom0: /Odometry                  # FAST-LIO2
        odom0_config: [true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: true
        odom0_differential: true
        odom0_relative: false

        # GPS projected into the map frame by navsat_transform_node.
        # x, y position only — GPS altitude is noisy and we rely on LIO
        # z-delta for vertical motion.
        odom1: /odometry/gps
        odom1_config: [true,  true,  false,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_nodelay: true
        odom1_differential: false
        odom1_relative: false

        # IMU supplies the gravity-aligned orientation (roll, pitch) and
        # all angular / linear-acc dynamics. Without this the map→odom
        # transform tilts over time because neither LIO-differential nor
        # GPS constrains the global orientation.
        imu0: /imu/data
        imu0_config: [false, false, false,
                      true,  true,  false,
                      false, false, false,
                      true,  true,  true,
                      true,  true,  true]
        imu0_queue_size: 50
        imu0_nodelay: true
        imu0_differential: false
        imu0_relative: false
        imu0_remove_gravitational_acceleration: true

navsat_transform_node:
    ros__parameters:
        use_sim_time: true
        frequency: 30.0
        # 5 s cushion lets LIO reach its first /Odometry and IMU gravity
        # alignment complete before GPS is introduced — reduces the wild
        # pose excursions users see in the first few seconds.
        delay: 5.0
        magnetic_declination_radians: 0.0
        yaw_offset: 0.0
        zero_altitude: false
        # Broadcasts utm → world_frame (map).  Without this, /odometry/gps
        # inherits the local-EKF's odom frame and ekf_filter_node_map can't
        # place it in the map frame.
        broadcast_utm_transform: true
        publish_filtered_gps: true
        use_odometry_yaw: false
        wait_for_datum: false
