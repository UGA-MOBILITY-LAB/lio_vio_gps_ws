# Dual-EKF + NavSat setup for GPS-anchored multi-source fusion.
#
#   ekf_filter_node_odom  (local)  — fuses LIO + VIO,   publishes odom→base_link
#   ekf_filter_node_map   (global) — fuses LIO + GPS,   publishes map→odom
#   navsat_transform_node          — GPS/fix + local pose → /odometry/gps
#
# RViz fixed-frame: map  (or camera_init — connected via static odom↔camera_init)
# Drift behaviour: LIO drifts over long drives; the global EKF pulls the
# odom frame back toward the GPS datum through the map→odom correction.

ekf_filter_node_odom:
    ros__parameters:
        use_sim_time: true
        frequency: 50.0
        two_d_mode: false
        publish_tf: true
        publish_acceleration: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom                 # local — publishes odom → base_link

        odom0: /Odometry                  # FAST-LIO2
        odom0_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_differential: false

        odom1: /vins_estimator/odometry   # VINS-Fusion (WIP, may be absent)
        odom1_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_differential: true

ekf_filter_node_map:
    ros__parameters:
        use_sim_time: true
        frequency: 50.0
        sensor_timeout: 0.1
        two_d_mode: false
        transform_time_offset: 0.0
        transform_timeout: 0.0
        publish_tf: true
        publish_acceleration: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: map                  # global — publishes map → odom

        # FAST-LIO's /Odometry origin is the start of the run (camera_init),
        # not the UTM datum — feeding it as absolute would fight GPS. Use
        # differential so EKF consumes only the pose *deltas* between
        # consecutive LIO messages (effectively velocity) and lets GPS own
        # the absolute map-frame position.
        odom0: /Odometry                  # FAST-LIO2
        odom0_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_nodelay: true
        odom0_differential: true
        odom0_relative: false

        # GPS projected into the map frame by navsat_transform_node.
        # Position-only (GPS has no orientation), absolute (GPS is the
        # global anchor that counters LIO long-term drift).
        odom1: /odometry/gps
        odom1_config: [true,  true,  false,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_nodelay: true
        odom1_differential: false
        odom1_relative: false

navsat_transform_node:
    ros__parameters:
        use_sim_time: true
        frequency: 30.0
        delay: 3.0
        magnetic_declination_radians: 0.0
        yaw_offset: 0.0
        zero_altitude: false
        # Broadcasts utm → world_frame (map).  Without this, /odometry/gps
        # inherits the local-EKF's odom frame and ekf_filter_node_map can't
        # place it in the map frame.
        broadcast_utm_transform: true
        publish_filtered_gps: true
        use_odometry_yaw: false
        wait_for_datum: false
