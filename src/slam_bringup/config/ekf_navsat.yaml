# Dual-EKF + NavSat setup for GPS-anchored multi-source fusion.
#
#   ekf_filter_node_odom  (local)  — fuses LIO + VIO,   publishes odom→base_link
#   ekf_filter_node_map   (global) — fuses LIO + GPS,   publishes map→odom
#   navsat_transform_node          — GPS/fix + local pose → /odometry/gps
#
# RViz fixed-frame: map  (or camera_init — connected via static odom↔camera_init)
# Drift behaviour: LIO drifts over long drives; the global EKF pulls the
# odom frame back toward the GPS datum through the map→odom correction.

ekf_filter_node_odom:
    ros__parameters:
        use_sim_time: true
        frequency: 50.0
        two_d_mode: false
        publish_tf: true
        publish_acceleration: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom                 # local — publishes odom → base_link

        odom0: /Odometry                  # FAST-LIO2
        odom0_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_differential: false

        odom1: /vins_estimator/odometry   # VINS-Fusion (WIP, may be absent)
        odom1_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_differential: true

ekf_filter_node_map:
    ros__parameters:
        use_sim_time: true
        frequency: 50.0
        two_d_mode: false
        publish_tf: true
        publish_acceleration: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: map                  # global — publishes map → odom

        odom0: /Odometry                  # FAST-LIO2
        odom0_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_differential: false

        # GPS odometry from navsat_transform_node.  Position-only — GPS gives
        # no orientation.  Absolute mode so it anchors the map frame and
        # corrects long-term LIO drift.
        odom1: /odometry/gps
        odom1_config: [true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_differential: false

navsat_transform_node:
    ros__parameters:
        use_sim_time: true
        frequency: 30.0
        magnetic_declination_radians: 0.0
        yaw_offset: 0.0
        zero_altitude: false
        # Global EKF now owns the map frame — navsat only emits /odometry/gps.
        broadcast_utm_transform: false
        publish_filtered_gps: true
        use_odometry_yaw: false
        wait_for_datum: false
