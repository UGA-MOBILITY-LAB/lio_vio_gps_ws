ekf_filter_node:
    ros__parameters:
        use_sim_time: true
        frequency: 50.0
        two_d_mode: false
        publish_tf: true
        publish_acceleration: false
        map_frame: map
        odom_frame: odom
        base_link_frame: base_link
        world_frame: odom

        # FAST-LIO2 odometry — absolute pose, high trust
        odom0: /Odometry
        odom0_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom0_queue_size: 10
        odom0_differential: false

        # VINS-Fusion odometry — differential mode (VIO drifts)
        odom1: /vins_estimator/odometry
        odom1_config: [true,  true,  true,
                       true,  true,  true,
                       false, false, false,
                       false, false, false,
                       false, false, false]
        odom1_queue_size: 10
        odom1_differential: true

navsat_transform_node:
    ros__parameters:
        use_sim_time: true
        frequency: 5.0
        magnetic_declination_radians: 0.0
        yaw_offset: 0.0
        zero_altitude: false
        broadcast_utm_transform: true
        publish_filtered_gps: true
        wait_for_datum: false
